name: pixelforge

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixelforge}
      POSTGRES_USER: ${POSTGRES_USER:-pixelforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixelforge}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pixelforge}
      AZURE_CONNECTION_STRING: ${AZURE_CONNECTION_STRING:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALLOWED_ORIGINS: ${PIXELFORGE_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ALLOW_TURNSTILE_TEST_BYPASS: "false"
      TRUST_PROXY_HEADERS: "false"
      TRUSTED_PROXY_CIDRS: ""
      CLOUDFLARE_SUBNETS: ""
      REQUIRE_CLOUDFLARE_PROXY: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_DEBUG_API: "false"
    restart: unless-stopped
    ports:
      - "${PIXELFORGE_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
