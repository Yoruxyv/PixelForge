name: Quality

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend-lighthouse:
    name: Frontend Lighthouse Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports

          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/pixelforge-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          for run in {1..5}; do
            ./node_modules/.bin/lighthouse http://127.0.0.1:4173/ \
              --preset=desktop \
              --output=json \
              --output-path="lighthouse-reports/desktop-$run.json" \
              --chrome-flags="--headless --no-sandbox" \
              --quiet
          done

          for run in {1..5}; do
            ./node_modules/.bin/lighthouse http://127.0.0.1:4173/ \
              --output=json \
              --output-path="lighthouse-reports/mobile-$run.json" \
              --chrome-flags="--headless --no-sandbox" \
              --quiet
          done

          npm run lighthouse:check -- lighthouse-reports
      - name: Upload Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: pixelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixelforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/pixelforge_test
      AZURE_CONNECTION_STRING: ""
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ""
      DISCORD_WEBHOOK_URL: ""
      REPLICATE_API_TOKEN: ""
      ALLOWED_ORIGINS: http://localhost:5173
      LOG_TO_FILE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Sync backend environment
        run: uv sync --locked
      - name: Validate cross-platform tooling
        run: |
          bash -n ../scripts/unix/start_app.sh ../scripts/unix/reset_usage.sh ../scripts/unix/dev/*.sh ../scripts/unix/testing/*.sh
          uv run python scripts/tooling/backend_checks.py --help
          uv run python ../scripts/tooling/line_count.py --help
          uv run ruff check --config pyproject.toml ../scripts/tooling/line_count.py
          uv run ruff format --check --config pyproject.toml ../scripts/tooling/line_count.py
          uv run mypy ../scripts/tooling/line_count.py
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest

  backend-baseline:
    name: Backend typing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Sync backend environment
        run: uv sync --locked
      - name: Mypy
        run: uv run mypy

  backend-compatibility:
    name: Backend compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: pixelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixelforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/pixelforge_test
      AZURE_CONNECTION_STRING: ""
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ""
      DISCORD_WEBHOOK_URL: ""
      REPLICATE_API_TOKEN: ""
      ALLOWED_ORIGINS: http://localhost:5173
      LOG_TO_FILE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Sync backend environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [frontend-quality, frontend-e2e, frontend-lighthouse, backend-quality, backend-baseline, backend-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        env:
          FRONTEND: ${{ needs.frontend-quality.result }}
          E2E: ${{ needs.frontend-e2e.result }}
          LIGHTHOUSE: ${{ needs.frontend-lighthouse.result }}
          BACKEND: ${{ needs.backend-quality.result }}
          TYPING: ${{ needs.backend-baseline.result }}
          COMPATIBILITY: ${{ needs.backend-compatibility.result }}
        run: '[[ "$FRONTEND" == success && "$E2E" == success && "$LIGHTHOUSE" == success && "$BACKEND" == success && "$TYPING" == success && "$COMPATIBILITY" == success ]]'
