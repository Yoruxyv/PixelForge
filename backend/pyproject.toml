[project]
name = "pixelforge-backend"
version = "0.0.0"
description = "FastAPI backend for the PixelForge image-processing application."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "aiofiles==25.1.0",
  "aiohttp==3.12.14",
  "httpx>=0.27.0",
  "replicate==1.0.7",
  "Pillow==12.1.1",
  "numpy>=2.4.6",
  "filetype==1.2.0",
  "python-dotenv==1.2.2",
  "email-validator>=2.1.0",
  "pydantic-settings>=2.0.0",
  "asyncpg>=0.29.0",
  "azure-storage-blob>=12.19.0",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "httpx2==2.10.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
fix = false

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "G",
  "I",
  "LOG",
  "PERF",
  "PIE",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
]
ignore = [
  "D107",
  "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"tests/**/*.py" = ["ARG", "D", "S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["scripts/reset_usage.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
files = [
  "api",
  "app",
  "core",
  "database",
  "domain",
  "limiter",
  "provider",
  "repository",
  "services",
  "tests",
  "utils",
  "main.py",
  "run.py",
  "scripts",
  "../scripts/tooling/line_count.py",
]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg", "filetype"]
ignore_missing_imports = true
