[tool.ruff]
line-length = 100
target-version = "py311"
fix = false

[tool.ruff.lint]
select = [
  "E",  # pycodestyle (errors)
  "F",  # pyflakes (unused vars, imports, etc.)
  "I",  # import sorting
  "B",  # bugbear (common mistakes)
]

ignore = [
  "E501",  # line too long (handled by formatter usually)
  "I001",  # import sorting (handled by formatter usually)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
files = [
  "api",
  "app",
  "core",
  "database",
  "domain",
  "limiter",
  "provider",
  "repository",
  "services",
  "tests",
  "utils",
  "main.py",
  "run.py",
]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg", "filetype"]
ignore_missing_imports = true
